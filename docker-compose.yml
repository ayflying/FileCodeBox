version: "3"
services:
  file-code-box:
    image: ghcr.io/ayflying/filecodebox:2.8.3 # x-release-please-version
    volumes:
      - fcb-data:/app/data:rw
    restart: unless-stopped
    ports:
      - "12345:12345"
      # 内置 STUN（P2P 直连候选收集，不依赖第三方 STUN）
      - "3478:3478/udp"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=warning
      - ACCESS_LOG=false
      - WORKERS=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  fcb-data:
    external: false
